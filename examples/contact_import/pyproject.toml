[project]
name = "localqueue-contact-import-example"
version = "0.1.0"
description = "Standalone CSV contact-import example for localqueue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "lmdb>=1.7,<2",
    "localqueue[bus]",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "faker>=30,<40",
    "pytest>=8,<10",
]

[tool.uv.sources]
localqueue = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
