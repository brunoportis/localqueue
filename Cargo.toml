[package]
name = "localqueue"
version = "1.4.1"
edition = "2021"
rust-version = "1.83"
description = "A persistent, multiprocess-safe local queue for Python, backed by SQLite and Rust."
license = "Apache-2.0"
repository = "https://github.com/brunoportis/localqueue"

[lib]
name = "localqueue"
crate-type = ["cdylib", "rlib"]

[features]
default = []
console = ["dep:eframe", "dep:egui-phosphor"]
# Internal-only crash harness support. Never enable this for a published wheel.
__crash_test = []

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
thiserror = "1.0"
eframe = { version = "0.31", default-features = true, optional = true }
egui-phosphor = { version = "0.9", optional = true }

[[bin]]
name = "localqueue-console"
path = "src/bin/localqueue-console.rs"
required-features = ["console"]
