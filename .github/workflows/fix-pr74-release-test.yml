name: One-shot PR74 release-test fix

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/fix-pr74-release-test.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release preparation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/66-release-v1.3.0
          fetch-depth: 0

      - name: Model the actual v1.2 to v1.3 uv.lock transition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_release_gate.py")
          text = path.read_text(encoding="utf-8")
          old = '''    before.write_text(
              '[[package]]\\nname = "dependency"\\nversion = "1.0"\\n\\n'
              '[[package]]\\nname = "localqueue"\\nversion = "1.3.0"\\nsource = { editable = "." }\\n',
          '''
          new = old.replace('version = "1.3.0"', 'version = "1.2.0"', 1)
          if text.count(old) != 1:
              raise SystemExit("expected exact uv.lock fixture block once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run focused release gate test
        run: |
          python -m pip install --upgrade "pytest>=8,<10" "packaging>=24,<26"
          pytest -q tests/test_release_gate.py

      - name: Commit only the focused fixture correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_release_gate.py
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "tests/test_release_gate.py"
          git commit -m "test: model uv lock transition from v1.2 to v1.3"
          git push origin HEAD:chore/66-release-v1.3.0
