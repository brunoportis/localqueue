# Exists only long enough to migrate this branch, then deletes itself.
name: One-shot v1.3 branch migration

on:
  push:
    branches: [chore/66-release-v1.3.0]
    paths: [.github/workflows/prepare-v13-branch.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release preparation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/66-release-v1.3.0
          fetch-depth: 0

      - name: Retarget campaign-only files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          campaign_files = (
              Path('.github/workflows/release-candidate.yml'),
              Path('.github/workflows/wheels.yml'),
              Path('tests/test_release_gate.py'),
              Path('tests/test_release_documentation.py'),
              Path('docs/internal/release-gate.md'),
          )
          for path in campaign_files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('1.2.0', '1.3.0')
              path.write_text(text, encoding='utf-8')

          runbook = Path('docs/internal/release-gate.md')
          text = runbook.read_text(encoding='utf-8')
          text = text.replace('v1.1.2', 'v1.2.0')
          text = text.replace('close #32', 'close #66')
          text = text.replace('parent epic #14', 'parent epic #60')
          runbook.write_text(text, encoding='utf-8')

          docs_test = Path('tests/test_release_documentation.py')
          text = docs_test.read_text(encoding='utf-8')
          text = text.replace('Only then close #32', 'Only then close #66')
          docs_test.write_text(text, encoding='utf-8')

          gate_test = Path('tests/test_release_gate.py')
          text = gate_test.read_text(encoding='utf-8')
          text = text.replace(
              'version = "1.1.2"\\nsource = { editable = "." }',
              'version = "1.2.0"\\nsource = { editable = "." }',
              1,
          )
          gate_test.write_text(text, encoding='utf-8')

          nav = Path('zensical.toml')
          text = nav.read_text(encoding='utf-8')
          marker = '  {"Getting started" = "getting-started.md"},\n'
          entry = '  {"Migrating to v1.3" = "migrating-to-1.3.md"},\n'
          if entry not in text:
              if marker not in text:
                  raise SystemExit('zensical navigation marker not found')
              text = text.replace(marker, marker + entry, 1)
              nav.write_text(text, encoding='utf-8')
          PY

      - name: Validate release gate migration
        run: |
          python -m pip install --upgrade "pytest>=8,<10" "packaging>=24,<26"
          python -m compileall -q release_gate
          python -m pytest -q tests/test_release_gate.py tests/test_release_documentation.py
          grep -R '1\.2\.0' \
            .github/workflows/release-candidate.yml \
            .github/workflows/wheels.yml \
            tests/test_release_gate.py \
            tests/test_release_documentation.py \
            docs/internal/release-gate.md \
            && { echo 'stale campaign reference remains'; exit 1; } || true
          grep -q 'Migrating to v1.3' zensical.toml

      - name: Commit migration and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-v13-branch.yml
          git add \
            .github/workflows/release-candidate.yml \
            .github/workflows/wheels.yml \
            tests/test_release_gate.py \
            tests/test_release_documentation.py \
            docs/internal/release-gate.md \
            zensical.toml
          git commit -m "chore: retarget release campaign to v1.3.0"
          git push origin HEAD:chore/66-release-v1.3.0
