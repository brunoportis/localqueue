[project]
name = "localqueue"
version = "1.4.1"
description = "A persistent, multiprocess-safe local queue for Python, backed by SQLite and Rust."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/brunoportis/localqueue"
Repository = "https://github.com/brunoportis/localqueue"
Issues = "https://github.com/brunoportis/localqueue/issues"

[project.optional-dependencies]
dev = [
    "hypothesis>=6,<7",
    "import-linter>=2,<3",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2,<3",
    "maturin>=1.14",
    "pydantic>=2,<3",
    "packaging>=24,<26",
    "mypy>=1.18,<2",
    "pyright>=1.1,<2",
    "ruff>=0.15,<1",
    "pyrefly>=1.1,<2",
    "pre-commit>=4,<5",
    "python-semantic-release>=10.6,<11",
]
docs = [
    "zensical>=0.0.51,<0.1",
]
benchmark = [
    "pydantic>=2,<3",
]
benchmark-compare = [
    "persist-queue==1.1.0",
]
bus = [
    "pydantic>=2,<3",
    "typing-extensions>=4.12,<5",
]

[build-system]
requires = ["maturin>=1.14"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 30

[tool.pyrefly]
preset = "strict"
project-includes = [
    "python/localqueue/**/*.py",
    "python/localqueue/**/*.pyi",
    "typing_tests/positive.py",
]
disable-project-excludes-heuristics = true
errors = { explicit-any = "warn" }

[tool.importlinter]
root_package = "localqueue"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "production-dependency-direction"
name = "Production dependency direction"
type = "layers"
containers = ["localqueue"]
layers = [
    "benchmark",
    "bus",
    "core : deadletter : diagnostics : exceptions : job : maintenance : policies : worker",
]
exhaustive = true

[[tool.importlinter.contracts]]
id = "facade-does-not-load-optional-packages"
name = "Facade does not load optional packages"
type = "forbidden"
source_modules = ["localqueue"]
forbidden_modules = [
    "localqueue.bus",
    "localqueue.bus.**",
    "localqueue.benchmark",
    "localqueue.benchmark.**",
    "pydantic",
]
as_packages = false

[[tool.importlinter.contracts]]
id = "pydantic-is-local-to-eventbus"
name = "Pydantic is local to EventBus"
type = "forbidden"
source_modules = ["localqueue"]
forbidden_modules = ["pydantic"]
ignore_imports = [
    "localqueue.bus -> pydantic",
    "localqueue.bus.event -> pydantic",
    "localqueue.bus.envelope -> pydantic",
]
unmatched_ignore_imports_alerting = "error"

[tool.coverage.run]
branch = true
source = ["localqueue"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.semantic_release]
assets = ["Cargo.lock"]
build_command = "cargo metadata --format-version=1 >/dev/null"
commit_message = "chore(release): v{version}"
no_git_verify = true
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:project.version",
    "Cargo.toml:package.version",
]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
insertion_flag = "<!-- version list -->"
mode = "update"

[tool.semantic_release.publish]
upload_to_vcs_release = false
